name: Release

# Pushing a tag such as 2.39.2-fork.1 builds every backend binary from source, packages it with the
# committed frontend dist/, and publishes a GitHub Release with the installable ZIP and its SHA256.
on:
  push:
    tags: ['*-fork.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(jq -r .version package.json)
          plugin=$(jq -r .info.version dist/plugin.json)
          if [ "$pkg" != "$TAG" ] || [ "$plugin" != "$TAG" ]; then
            echo "tag=$TAG package.json=$pkg dist/plugin.json=$plugin must all match"; exit 1
          fi
          if [ "$(jq -r .id dist/plugin.json)" != aliyun-log-service-datasource ]; then
            echo "unexpected plugin id"; exit 1
          fi

      - name: Test and build backends
        run: |
          go test ./pkg/
          make all

      - name: Package
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          id=aliyun-log-service-datasource
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp -R dist "$stage/$id"
          chmod +x "$stage/$id"/gpx_*
          zip_name="$id-$TAG.zip"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$zip_name" "$id")
          sha256sum "$zip_name" > "$zip_name.sha256"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --title "$TAG" --notes "Built from $(git rev-parse --short HEAD). See CHANGELOG.md."

name: Release

# Pushing a tag such as v0.1.0 builds the frontend and every backend binary from source and
# publishes a GitHub Release with the installable ZIP and its SHA256.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(jq -r .version package.json)
          if [ "v$pkg" != "$TAG" ]; then
            echo "tag=$TAG package.json=$pkg must match"; exit 1
          fi

      - name: Test and build the frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:ci
          npm run build

      - name: Test and build backends
        run: |
          go test ./pkg/
          make all

      - name: Add notices and the licenses of Go dependencies
        run: |
          cp NOTICE dist/
          scripts/collect-go-licenses.sh dist/licenses

      - name: Check the built plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(jq -r .info.version dist/plugin.json)" = "$TAG"
          test "$(jq -r .id dist/plugin.json)" = nethinwei-sls-datasource
          ls dist/module.js dist/gpx_sls-datasource_linux_amd64 dist/gpx_sls-datasource_linux_arm64

      - name: Package
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          id=nethinwei-sls-datasource
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp -R dist "$stage/$id"
          chmod +x "$stage/$id"/gpx_*
          zip_name="$id-$TAG.zip"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$zip_name" "$id")
          sha256sum "$zip_name" > "$zip_name.sha256"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --title "$TAG" --notes "Built from $(git rev-parse --short HEAD). See CHANGELOG.md."
